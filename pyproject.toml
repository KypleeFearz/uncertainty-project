[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-project14"
version = "0.1.0"
description = "Interpretable uncertainty assessment for ChaosNLI: an executable research starting point"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2",
  "openai>=2.54,<3", "anthropic>=1.0,<2", "pydantic>=2.7,<3", "python-dotenv>=1,<2",
  "jupyterlab>=4,<5", "ipykernel>=6.29,<8", "ipywidgets>=8,<9"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
